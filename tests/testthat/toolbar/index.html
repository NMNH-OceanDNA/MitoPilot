<script>
  // Stand-in for Shiny's action-button binding: a per-element click count,
  // re-sent only when the count differs from the last value sent for that id.
  window.__sent = {}; window.__arrived = [];
  $('.action-button').each(function () {
    $(this).on('click', function () {
      var v = ($(this).data('val') || 0) + 1;
      $(this).data('val', v);
      if (window.__sent[this.id] !== v) { window.__sent[this.id] = v; window.__arrived.push(this.id + ':' + v); }
    });
  });
</script>
